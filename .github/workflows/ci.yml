name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: Install
        run: uv sync --locked --extra dev --python 3.13
      - name: Lint
        run: uv run --locked ruff check .
      # Offline: a fake session, never a router.
      - name: Tests
        run: uv run --locked pytest -vv

  docker-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t keelson-storage-reaper .
      - name: Smoke test the entry point
        run: docker run --rm keelson-storage-reaper "keelson-storage-reaper --help"
